  <rect class="bg" x="0" y="0" width="900" height="712"/>
  <text x="30.0" y="40.0" font-size="12" class="mono eyebrow" text-anchor="start">ZFS-AUTOBACKUP · THE THINNER</text>
  <text x="30.0" y="78.0" font-size="28" font-weight="800" text-anchor="start">How the thinner picks the snapshots to keep</text>
  <text x="30.0" y="106.0" font-size="15" class="muted" text-anchor="start">Each rule cuts time into blocks. In every block, the rule keeps the oldest snapshot.</text>
  <text x="30.0" y="126.0" font-size="15" class="muted" text-anchor="start">A snapshot stays when at least one rule keeps it. All other snapshots are removed.</text>
  <rect class="panel" x="30" y="150" width="840" height="112" rx="10"/>
  <text x="56.0" y="216.0" font-size="44" class="mono t-new" font-weight="700" text-anchor="start">1d</text>
  <text x="118.0" y="216.0" font-size="44" class="mono accent" font-weight="700" text-anchor="start">1w</text>
  <path class="bracket" d="M 56 226 L 56 232 L 108 232 L 108 226"/>
  <path class="bracket" d="M 118 226 L 118 232 L 170 232 L 170 226"/>
  <text x="82.0" y="250.0" font-size="12" class="t-new" font-weight="700" text-anchor="middle">block size</text>
  <text x="144.0" y="250.0" font-size="12" class="accent" font-weight="700" text-anchor="middle">how long</text>
  <text x="220.0" y="180.0" font-size="14" text-anchor="start"><tspan class="mono t-new" font-weight="700">1d</tspan> = one block per day: keep one snapshot per day.</text>
  <text x="220.0" y="202.0" font-size="14" text-anchor="start"><tspan class="mono accent" font-weight="700">1w</tspan> = the rule only looks at the last week. Older blocks get nothing from it.</text>
  <text x="220.0" y="224.0" font-size="14" text-anchor="start">A list of rules is a schedule, for example <tspan class="mono">10,1d1w,1w1m,1m1y</tspan>.</text>
  <text x="220.0" y="246.0" font-size="14" text-anchor="start">A plain number (<tspan class="mono">10</tspan>) always keeps the last 10 snapshots.</text>
  <rect class="panel" x="30" y="290" width="840" height="350" rx="10"/>
  <text x="50.0" y="320.0" font-size="15" font-weight="700" text-anchor="start">Example: schedule <tspan class="mono">1d1w,1w1m</tspan>, a snapshot every 12 hours, 3 weeks</text>
