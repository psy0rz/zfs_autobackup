<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" role="img" aria-labelledby="title desc">
  <title id="title">How the zfs-autobackup thinner works</title>
  <desc id="desc">Each thinning rule splits time into blocks and keeps the oldest snapshot per block, within its time to live. A snapshot stays when any rule keeps it.</desc>

  <style>
    .bg { fill: #f3f6f6; }
    .panel { fill: #ffffff; stroke: #c9d4d7; stroke-width: 1.2; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #142228; }
    .mono { font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .eyebrow { fill: #0d7480; letter-spacing: 1.2px; }
    .muted { fill: #5a6b72; }
    .accent { fill: #0d7480; }
    .t-new { fill: #b8650f; }
    .t-gone { fill: #b4383b; }
    .rail { stroke: #c9d4d7; stroke-width: 2; }
    .snapshot { fill: #5a6b72; }
    .guide { stroke: #0d7480; stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.6; }
    .block { fill: #ffffff; stroke: #c9d4d7; stroke-width: 1; }
    .block-daily { fill: #f6e5d0; stroke: #b8650f; stroke-width: 1; }
    .block-weekly { fill: #d5ecee; stroke: #0d7480; stroke-width: 1; }
    .block-expired { fill: #e8eded; stroke: #c9d4d7; stroke-width: 1; }
    .pick-daily { fill: #b8650f; }
    .pick-weekly { fill: #0d7480; }
    .kept { fill: #0d7480; }
    .x { stroke: #b4383b; stroke-width: 1.8; }
    .bracket { fill: none; stroke: #5a6b72; stroke-width: 1.3; }
    .tick { stroke: #5a6b72; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1719; }
      .panel { fill: #172226; stroke: #2f4046; }
      text { fill: #e3ecee; }
      .muted { fill: #93a6ac; }
      .eyebrow, .accent { fill: #4fc0cb; }
      .t-new { fill: #eba150; }
      .t-gone { fill: #ec7b7d; }
      .rail { stroke: #2f4046; }
      .snapshot { fill: #93a6ac; }
      .guide { stroke: #4fc0cb; }
      .block { fill: #172226; stroke: #2f4046; }
      .block-daily { fill: #3d2a14; stroke: #eba150; }
      .block-weekly { fill: #163a3f; stroke: #4fc0cb; }
      .block-expired { fill: #1c2a2e; stroke: #2f4046; }
      .pick-daily { fill: #eba150; }
      .pick-weekly, .kept { fill: #4fc0cb; }
      .x { stroke: #ec7b7d; }
      .bracket, .tick { stroke: #93a6ac; }
    }
