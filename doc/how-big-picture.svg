<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Source and target</title>
  <desc id="desc">Datasets with autobackup:offsite1 set are sent from the source to the target, where they appear under TARGET-PATH with the same path.</desc>

  <style>
    .bg { fill: #f3f6f6; }
    .host { fill: #ffffff; stroke: #c9d4d7; stroke-width: 1.5; }
    .panel { fill: #ffffff; stroke: #c9d4d7; stroke-width: 1.2; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #142228; }
    .mono { font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .muted { fill: #5a6b72; }
    .ds { fill: #ffffff; stroke: #c9d4d7; stroke-width: 1.2; }
    .ds-sel { fill: #d5ecee; stroke: #0d7480; stroke-width: 1.5; }
    .ds-new { fill: #f6e5d0; stroke: #b8650f; stroke-width: 1.5; }
    .t-accent { fill: #0d7480; }
    .t-new { fill: #b8650f; }
    .t-gone { fill: #b4383b; }
    .wire { stroke: #b8650f; stroke-width: 2.5; fill: none; }
    .wire-head { fill: #b8650f; }
    .rail { stroke: #c9d4d7; stroke-width: 2; }
    .snap { fill: #ffffff; stroke: #5a6b72; stroke-width: 2; }
    .snap-common { fill: #0d7480; stroke: #0d7480; stroke-width: 2; }
    .snap-new { fill: #b8650f; stroke: #b8650f; stroke-width: 2; }
    .snap-ghost { fill: #f3f6f6; stroke: #b8650f; stroke-width: 2; stroke-dasharray: 3 3; }
    .snap-gone { fill: #ffffff; stroke: #b4383b; stroke-width: 2; }
    .x { stroke: #b4383b; stroke-width: 2.2; }
    .link { stroke: #0d7480; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .band { fill: #f6e5d0; stroke: #b8650f; stroke-width: 1.5; }
    .band-ghost { fill: none; stroke: #b8650f; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .server { fill: #ffffff; stroke: #5a6b72; stroke-width: 1.5; }
    .server-line { stroke: #c9d4d7; stroke-width: 1.5; }
    .runner { fill: #b8650f; }
    .flow { stroke: #0d7480; stroke-width: 2.2; fill: none; }
    .flow-head { fill: #0d7480; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1719; }
      .host, .panel { fill: #172226; stroke: #2f4046; }
      text { fill: #e3ecee; }
      .muted { fill: #93a6ac; }
      .ds { fill: #172226; stroke: #2f4046; }
      .ds-sel { fill: #163a3f; stroke: #4fc0cb; }
      .ds-new { fill: #3d2a14; stroke: #eba150; }
      .t-accent { fill: #4fc0cb; }
      .t-new { fill: #eba150; }
      .t-gone { fill: #ec7b7d; }
      .wire { stroke: #eba150; }
      .wire-head { fill: #eba150; }
      .rail { stroke: #2f4046; }
      .snap { fill: #172226; stroke: #93a6ac; }
      .snap-common { fill: #4fc0cb; stroke: #4fc0cb; }
      .snap-new { fill: #eba150; stroke: #eba150; }
      .snap-ghost { fill: #0f1719; stroke: #eba150; }
      .snap-gone { fill: #172226; stroke: #ec7b7d; }
      .x { stroke: #ec7b7d; }
      .link { stroke: #4fc0cb; }
      .band { fill: #3d2a14; stroke: #eba150; }
      .band-ghost { stroke: #eba150; }
      .server { fill: #172226; stroke: #93a6ac; }
      .server-line { stroke: #2f4046; }
      .runner { fill: #eba150; }
      .flow { stroke: #4fc0cb; }
      .flow-head { fill: #4fc0cb; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="360" rx="12"/>
  <rect class="host" x="20" y="20" width="330" height="320" rx="10"/>
  <text x="40.0" y="50.0" font-size="15" font-weight="700" text-anchor="start">Source · pve01</text>
  <text x="40.0" y="70.0" font-size="12" class="muted" text-anchor="start">the data you want to protect</text>
  <rect class="ds" x="40" y="88" width="290" height="38" rx="6"/>
  <text x="54.0" y="112.0" font-size="13" class="mono" text-anchor="start">rpool</text>
  <text x="316.0" y="112.0" font-size="11" class="mono muted" text-anchor="end">not set</text>
  <rect class="ds-sel" x="56" y="136" width="274" height="38" rx="6"/>
  <text x="70.0" y="160.0" font-size="13" class="mono" text-anchor="start">rpool/data</text>
  <text x="316.0" y="160.0" font-size="11" class="mono t-accent" text-anchor="end">=true</text>
  <rect class="ds-sel" x="72" y="184" width="258" height="38" rx="6"/>
  <text x="86.0" y="208.0" font-size="13" class="mono" text-anchor="start">rpool/data/vm-100</text>
  <text x="316.0" y="208.0" font-size="11" class="mono t-accent" text-anchor="end">inherited</text>
  <rect class="ds-sel" x="72" y="232" width="258" height="38" rx="6"/>
  <text x="86.0" y="256.0" font-size="13" class="mono" text-anchor="start">rpool/data/vm-101</text>
  <text x="316.0" y="256.0" font-size="11" class="mono t-accent" text-anchor="end">inherited</text>
  <rect class="ds" x="72" y="280" width="258" height="38" rx="6"/>
  <text x="86.0" y="304.0" font-size="13" class="mono" text-anchor="start">rpool/data/scratch</text>
  <text x="316.0" y="304.0" font-size="11" class="mono muted" text-anchor="end">=false</text>
  <path class="wire" d="M 360 195 L 518 195"/>
  <polygon class="wire-head" points="530.0,195.0 516.0,203.4 516.0,186.6"/>
  <text x="445.0" y="178.0" font-size="13" class="t-new" font-weight="700" text-anchor="middle">zfs send | zfs recv</text>
  <text x="445.0" y="221.0" font-size="12" class="muted" text-anchor="middle">over SSH, or local</text>
  <text x="445.0" y="239.0" font-size="12" class="muted" text-anchor="middle">only the changes since</text>
  <text x="445.0" y="255.0" font-size="12" class="muted" text-anchor="middle">the last common snapshot</text>
  <rect class="host" x="540" y="20" width="340" height="320" rx="10"/>
  <text x="560.0" y="50.0" font-size="15" font-weight="700" text-anchor="start">Target · backupserver</text>
  <text x="560.0" y="70.0" font-size="12" class="muted" text-anchor="start">TARGET-PATH = backup/pve01</text>
  <rect class="ds" x="560" y="88" width="300" height="38" rx="6"/>
  <text x="574.0" y="112.0" font-size="13" class="mono" text-anchor="start">backup/pve01</text>
  <text x="846.0" y="112.0" font-size="11" class="mono muted" text-anchor="end">you create this</text>
  <rect class="ds-new" x="576" y="136" width="284" height="38" rx="6"/>
  <text x="590.0" y="160.0" font-size="13" class="mono" text-anchor="start">…/pve01/rpool/data</text>
  <rect class="ds-new" x="592" y="184" width="268" height="38" rx="6"/>
  <text x="606.0" y="208.0" font-size="13" class="mono" text-anchor="start">…/rpool/data/vm-100</text>
  <rect class="ds-new" x="592" y="232" width="268" height="38" rx="6"/>
  <text x="606.0" y="256.0" font-size="13" class="mono" text-anchor="start">…/rpool/data/vm-101</text>
  <text x="560.0" y="302.0" font-size="12" class="muted" text-anchor="start">Same path as on the source,</text>
  <text x="560.0" y="320.0" font-size="12" class="muted" text-anchor="start">under TARGET-PATH.</text>
</svg>
